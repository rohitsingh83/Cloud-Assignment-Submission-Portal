<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Backdrop -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Background App Blur Mockup -->
  <rect x="50" y="50" width="1100" height="700" rx="16" fill="#1e293b" opacity="0.3" />

  <!-- In-Browser Preview Modal Window -->
  <g transform="translate(150, 70)" filter="url(#modalShadow)">
    <!-- Modal Container -->
    <rect width="900" height="660" rx="20" fill="#ffffff" />

    <!-- Modal Header -->
    <rect width="900" height="65" rx="20" fill="#f8fafc" />
    <rect x="0" y="50" width="900" height="15" fill="#f8fafc" />
    <line x1="0" y1="65" x2="900" y2="65" stroke="#e2e8f0" stroke-width="1" />

    <!-- File Icon & Details -->
    <rect x="25" y="16" width="34" height="34" rx="8" fill="#eef2ff" stroke="#c7d2fe" />
    <text x="42" y="38" fill="#4f46e5" font-family="'Segoe UI', sans-serif" font-size="16" text-anchor="middle">&#x1F4C4;</text>

    <text x="70" y="32" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">Preview: jordan_lee_cloud_capstone.pdf</text>
    <text x="70" y="48" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500">Cloud Storage Asset Stream &#8226; Content-Type: application/pdf &#8226; Verified Magic Header (%PDF-1.4)</text>

    <!-- Header Action Buttons -->
    <rect x="730" y="18" width="105" height="32" rx="8" fill="#4f46e5" />
    <text x="782" y="38" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">&#x21E9; Download</text>

    <rect x="845" y="18" width="32" height="32" rx="8" fill="#f1f5f9" />
    <text x="861" y="38" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">&#215;</text>

    <!-- Document Viewer Canvas -->
    <rect x="25" y="85" width="850" height="545" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />

    <!-- Simulated Document Page -->
    <g transform="translate(185, 105)">
      <rect width="530" height="505" rx="4" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))" />
      
      <!-- Document Header Bar -->
      <rect x="40" y="35" width="450" height="2" fill="#4f46e5" />
      <text x="40" y="28" fill="#1e1b4b" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900">STUDENT PROJECT SUBMISSION REPORT</text>
      <text x="490" y="28" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="end">AUTUMN 2026</text>

      <!-- Document Content Blocks -->
      <text x="40" y="65" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800">Topic: Distributed Database Replication and S3 Object Storage</text>
      <text x="40" y="85" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10">Author: Jordan Lee &#8226; Student ID: STU-89214 &#8226; Course: CS-401 Cloud Systems</text>

      <rect x="40" y="105" width="450" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="52" y="123" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">Abstract:</text>
      <text x="52" y="138" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9.5">This lab explores high-availability distributed storage paradigms with cloud-native</text>
      <text x="52" y="152" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9.5">persistence layers, ensuring ACID compliance and atomic file writes across tenants.</text>

      <!-- Architecture Diagram in PDF -->
      <rect x="40" y="185" width="450" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="265" y="205" fill="#1e1b4b" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" text-anchor="middle">Figure 1.1: Multi-Region High-Availability Replication Topology</text>

      <rect x="70" y="225" width="90" height="40" rx="6" fill="#e0e7ff" stroke="#818cf8" />
      <text x="115" y="248" fill="#3730a3" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">FastAPI Primary</text>

      <line x1="160" y1="245" x2="220" y2="245" stroke="#4f46e5" stroke-width="2" stroke-dasharray="3,3" />

      <rect x="220" y="225" width="95" height="40" rx="6" fill="#ecfdf5" stroke="#34d399" />
      <text x="267" y="248" fill="#065f46" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">S3 Object Bucket</text>

      <line x1="315" y1="245" x2="375" y2="245" stroke="#10b981" stroke-width="2" />

      <rect x="375" y="225" width="90" height="40" rx="6" fill="#fef3c7" stroke="#fbbf24" />
      <text x="420" y="248" fill="#92400e" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">PostgreSQL DB</text>

      <rect x="40" y="355" width="450" height="110" rx="6" fill="#ffffff" />
      <text x="40" y="375" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800">Experimental Evaluation:</text>
      <text x="40" y="395" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9.5">&#8226; Latency p95: 14.2ms across 500 concurrent submissions.</text>
      <text x="40" y="415" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9.5">&#8226; Zero data loss observed during randomized node failover tests.</text>
      <text x="40" y="435" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9.5">&#8226; End-to-end checksum verification matches SHA-256 digests accurately.</text>
    </g>
  </g>
</svg>
