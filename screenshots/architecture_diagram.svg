<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="740" fill="#0a0f1d" />

  <!-- Title & Header -->
  <text x="600" y="48" fill="#ffffff" font-size="26" font-weight="900" text-anchor="middle" letter-spacing="1">CLOUD-BASED STUDENT ASSIGNMENT SUBMISSION &amp; FEEDBACK PORTAL</text>
  <text x="600" y="74" fill="#94a3b8" font-size="14" font-weight="500" text-anchor="middle">Distributed Microservice &amp; Multi-Tenant Cloud Architecture (Vercel + Render + Decoupled Cloud Storage)</text>

  <!-- LAYER 1: CLIENT & EDGE CDN (Vercel) -->
  <rect x="40" y="105" width="1120" height="150" rx="16" fill="#131b2e" stroke="#1e293b" stroke-width="2" filter="url(#shadow)" />
  <rect x="56" y="117" width="220" height="26" rx="6" fill="#1e293b" />
  <text x="66" y="134" fill="#38bdf8" font-size="12" font-weight="700">LAYER 1: CLIENT &amp; GLOBAL EDGE CDN</text>

  <!-- Browser Client -->
  <rect x="70" y="155" width="220" height="80" rx="12" fill="#1e293b" stroke="#334155" />
  <text x="85" y="185" fill="#f8fafc" font-size="14" font-weight="700">Student &amp; Faculty Clients</text>
  <text x="85" y="205" fill="#94a3b8" font-size="11">Single Page App (HTML5 / Tailwind)</text>
  <text x="85" y="222" fill="#64748b" font-size="10">JWT Auth Session In-Memory</text>

  <!-- Vercel CDN -->
  <rect x="340" y="155" width="250" height="80" rx="12" fill="url(#indigoGrad)" filter="url(#shadow)" />
  <text x="360" y="185" fill="#ffffff" font-size="15" font-weight="800">▲ Vercel Global Edge CDN</text>
  <text x="360" y="205" fill="#e0e7ff" font-size="11">Sub-second Static Asset Delivery</text>
  <text x="360" y="222" fill="#c7d2fe" font-size="10">HTTPS SSL Termination &amp; Edge Cache</text>

  <!-- Connecting Arrows -->
  <path d="M 290 195 L 340 195" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="340,195 332,190 332,200" fill="#38bdf8" />

  <!-- API Gateway Call -->
  <path d="M 590 195 L 750 195 L 750 280" stroke="#818cf8" stroke-width="2" fill="none" stroke-dasharray="4,4" />
  <polygon points="750,285 745,277 755,277" fill="#818cf8" />
  <text x="760" y="240" fill="#a5b4fc" font-size="11" font-weight="600">REST API / HTTPS</text>

  <!-- Security Guard Card -->
  <rect x="870" y="155" width="260" height="80" rx="12" fill="#1e293b" stroke="#334155" />
  <text x="890" y="185" fill="#34d399" font-size="14" font-weight="700">🔒 Zero-Trust Security</text>
  <text x="890" y="205" fill="#94a3b8" font-size="11">PBKDF2-HMAC-SHA256 (100k)</text>
  <text x="890" y="222" fill="#64748b" font-size="10">Cross-Tenant Isolation Guaranteed</text>

  <!-- LAYER 2: COMPUTE & API GATEWAY (Render) -->
  <rect x="40" y="285" width="1120" height="205" rx="16" fill="#131b2e" stroke="#1e293b" stroke-width="2" filter="url(#shadow)" />
  <rect x="56" y="297" width="250" height="26" rx="6" fill="#1e293b" />
  <text x="66" y="314" fill="#a855f7" font-size="12" font-weight="700">LAYER 2: COMPUTE &amp; API GATEWAY (Render)</text>

  <!-- Render Web Service -->
  <rect x="70" y="335" width="280" height="135" rx="12" fill="url(#blueGrad)" filter="url(#shadow)" />
  <text x="90" y="365" fill="#ffffff" font-size="16" font-weight="800">⚡ Render Web Service (FastAPI)</text>
  <text x="90" y="388" fill="#dbeafe" font-size="12">Asynchronous ASGI Event Loop (Uvicorn)</text>
  <text x="90" y="410" fill="#bfdbfe" font-size="11">• Multi-stage Docker Container</text>
  <text x="90" y="430" fill="#bfdbfe" font-size="11">• Stateless Auto-scaling Architecture</text>
  <text x="90" y="450" fill="#bfdbfe" font-size="11">• Liveness &amp; Readiness Probe (/api/health)</text>

  <!-- Core Modules -->
  <!-- Module 1: Auth & RBAC -->
  <rect x="380" y="335" width="220" height="60" rx="10" fill="#1e293b" stroke="#334155" />
  <text x="395" y="360" fill="#f8fafc" font-size="13" font-weight="700">Role-Based Access Control</text>
  <text x="395" y="378" fill="#94a3b8" font-size="11">Teacher / Student Token Guard</text>

  <!-- Module 2: Submission Engine -->
  <rect x="380" y="410" width="220" height="60" rx="10" fill="#1e293b" stroke="#334155" />
  <text x="395" y="435" fill="#f8fafc" font-size="13" font-weight="700">Submission Stream Engine</text>
  <text x="395" y="453" fill="#94a3b8" font-size="11">Server UTC Deadline Evaluation</text>

  <!-- Module 3: Similarity & Plagiarism -->
  <rect x="630" y="335" width="240" height="60" rx="10" fill="url(#purpleGrad)" />
  <text x="645" y="360" fill="#ffffff" font-size="13" font-weight="800">✨ Plagiarism Scanner</text>
  <text x="645" y="378" fill="#f3e8ff" font-size="11">n-gram Jaccard Set Similarity</text>

  <!-- Module 4: Grade & CSV Export -->
  <rect x="630" y="410" width="240" height="60" rx="10" fill="#1e293b" stroke="#334155" />
  <text x="645" y="435" fill="#f8fafc" font-size="13" font-weight="700">Evaluation &amp; CSV Export</text>
  <text x="645" y="453" fill="#94a3b8" font-size="11">Feedback Loop &amp; Grade Rosters</text>

  <!-- Module 5: Inline Document Preview -->
  <rect x="895" y="335" width="240" height="135" rx="10" fill="#1e293b" stroke="#334155" />
  <text x="915" y="365" fill="#38bdf8" font-size="14" font-weight="700">📄 In-Browser Preview</text>
  <text x="915" y="390" fill="#94a3b8" font-size="11">Inline MIME Dispatcher</text>
  <text x="915" y="410" fill="#64748b" font-size="11">• PDF stream viewer</text>
  <text x="915" y="430" fill="#64748b" font-size="11">• Code / text highlighters</text>
  <text x="915" y="450" fill="#64748b" font-size="11">• Authenticated query tokens</text>

  <!-- LAYER 3: DECOUPLED DATA & STORAGE LAYER -->
  <rect x="40" y="520" width="1120" height="185" rx="16" fill="#131b2e" stroke="#1e293b" stroke-width="2" filter="url(#shadow)" />
  <rect x="56" y="532" width="280" height="26" rx="6" fill="#1e293b" />
  <text x="66" y="549" fill="#10b981" font-size="12" font-weight="700">LAYER 3: DECOUPLED CLOUD DATA &amp; STORAGE</text>

  <!-- Relational DB -->
  <rect x="70" y="570" width="490" height="115" rx="12" fill="#1e293b" stroke="#334155" />
  <circle cx="105" cy="605" r="18" fill="url(#emeraldGrad)" />
  <text x="135" y="605" fill="#f8fafc" font-size="16" font-weight="800">Structured Relational Database</text>
  <text x="135" y="625" fill="#34d399" font-size="12">SQLite (Local/Demo) &#8226; PostgreSQL / Supabase (Cloud Production)</text>
  <text x="135" y="645" fill="#94a3b8" font-size="11">ACID Transactions &#8226; Users, Courses, Assignments, Grades &amp; Audit Logs</text>
  <text x="135" y="665" fill="#64748b" font-size="10">Connection pooling with thread-safety and row factories</text>

  <!-- Cloud Object Storage -->
  <rect x="600" y="570" width="535" height="115" rx="12" fill="#1e293b" stroke="#334155" />
  <circle cx="635" cy="605" r="18" fill="url(#amberGrad)" />
  <text x="665" y="605" fill="#f8fafc" font-size="16" font-weight="800">Decoupled Cloud Object Storage Vault</text>
  <text x="665" y="625" fill="#fbbf24" font-size="12">Supabase S3-Compatible Cloud Storage Driver</text>
  <text x="665" y="645" fill="#94a3b8" font-size="11">Hierarchical Path: assignments/{assignment_id}/{student_id}/{file_name}</text>
  <text x="665" y="665" fill="#64748b" font-size="10">Path traversal protection with boundary assertion &#8226; 25MB max size limit</text>

  <!-- Downward arrows from Layer 2 to Layer 3 -->
  <path d="M 315 470 L 315 570" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="315,570 310,562 320,562" fill="#34d399" />

  <path d="M 870 470 L 870 570" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="870,570 865,562 875,562" fill="#fbbf24" />
</svg>
