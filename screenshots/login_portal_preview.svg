<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="200" r="180" fill="#4f46e5" opacity="0.15" filter="blur(60px)" />
  <circle cx="1000" cy="300" r="220" fill="#7c3aed" opacity="0.12" filter="blur(80px)" />
  <circle cx="600" cy="700" r="250" fill="#06b6d4" opacity="0.08" filter="blur(90px)" />

  <!-- Top Mockup Header Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#0f172a" opacity="0.9" />
  <circle cx="40" cy="30" r="6" fill="#ef4444" />
  <circle cx="60" cy="30" r="6" fill="#f59e0b" />
  <circle cx="80" cy="30" r="6" fill="#10b981" />
  <rect x="360" y="16" width="480" height="28" rx="8" fill="#1e293b" />
  <text x="600" y="35" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" text-anchor="middle">https://cloud-assignment-portal.vercel.app &bull; Institutional Authentication</text>

  <!-- Main Auth Card Container -->
  <g transform="translate(370, 90)" filter="url(#shadow)">
    <!-- Outer Card Background -->
    <rect width="460" height="640" rx="24" fill="#ffffff" />

    <!-- Card Hero Header -->
    <rect width="460" height="190" rx="24" fill="url(#cardGrad)" />
    <!-- Clip bottom rounded corners of the header -->
    <rect x="0" y="170" width="460" height="20" fill="url(#cardGrad)" />

    <!-- Header Badge & Icon -->
    <circle cx="230" cy="65" r="28" fill="#4338ca" opacity="0.8" />
    <path d="M216 65 L230 52 L244 65 L230 78 Z" fill="#c7d2fe" />
    <path d="M222 72 L230 80 L238 72" stroke="#ffffff" stroke-width="2" fill="none" />

    <text x="230" y="118" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle">Institutional Cloud Portal</text>
    <text x="230" y="140" fill="#c7d2fe" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Decoupled Cloud Architecture for Assignment Workflows</text>

    <!-- Tech Badges -->
    <rect x="80" y="155" width="85" height="22" rx="6" fill="#1e1b4b" opacity="0.6" />
    <text x="122" y="170" fill="#a5b4fc" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">&#x2714; JWT Auth</text>

    <rect x="175" y="155" width="110" height="22" rx="6" fill="#1e1b4b" opacity="0.6" />
    <text x="230" y="170" fill="#a5b4fc" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">&#x2601; Cloud Storage</text>

    <rect x="295" y="155" width="85" height="22" rx="6" fill="#1e1b4b" opacity="0.6" />
    <text x="337" y="170" fill="#a5b4fc" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">&#x26A1; FastAPI</text>

    <!-- Tabs: Sign In / Register -->
    <rect x="0" y="190" width="230" height="42" fill="#ffffff" />
    <rect x="230" y="190" width="230" height="42" fill="#f8fafc" />
    <line x1="0" y1="232" x2="230" y2="232" stroke="#4f46e5" stroke-width="3" />
    <line x1="230" y1="232" x2="460" y2="232" stroke="#e2e8f0" stroke-width="1" />
    <text x="115" y="216" fill="#4f46e5" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Sign In</text>
    <text x="345" y="216" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Create Account</text>

    <!-- Email Field -->
    <text x="40" y="265" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800">EMAIL ADDRESS</text>
    <rect x="40" y="275" width="380" height="42" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="56" y="301" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="13">teacher@cloudportal.edu</text>

    <!-- Password Field -->
    <text x="40" y="340" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800">PASSWORD</text>
    <rect x="40" y="350" width="380" height="42" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="56" y="377" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="15">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</text>

    <!-- Submit Button -->
    <rect x="40" y="415" width="380" height="46" rx="12" fill="url(#btnGrad)" />
    <text x="230" y="443" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Authenticate &amp; Enter Portal &rarr;</text>

    <!-- 1-Click Demo Profiles Divider -->
    <line x1="40" y1="485" x2="420" y2="485" stroke="#e2e8f0" stroke-width="1" />
    <rect x="150" y="475" width="160" height="20" rx="4" fill="#ffffff" />
    <text x="230" y="489" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" text-anchor="middle">1-CLICK DEMO PROFILES</text>

    <!-- Faculty Demo Card -->
    <rect x="40" y="510" width="180" height="58" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1" />
    <rect x="52" y="522" width="34" height="34" rx="8" fill="#4f46e5" />
    <text x="69" y="543" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" text-anchor="middle">&#x1F393;</text>
    <text x="96" y="534" fill="#1e1b4b" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800">Faculty Demo</text>
    <text x="96" y="550" fill="#6366f1" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">Prof. Sarah</text>

    <!-- Student Demo Card -->
    <rect x="240" y="510" width="180" height="58" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <rect x="252" y="522" width="34" height="34" rx="8" fill="#10b981" />
    <text x="269" y="543" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" text-anchor="middle">&#x1F4DA;</text>
    <text x="296" y="534" fill="#064e3b" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800">Student Demo</text>
    <text x="296" y="550" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">Alex Chen</text>

    <!-- Security Footer -->
    <text x="230" y="605" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">&#x1F512; Protected with Argon2 Password Hashing &amp; Bearer Tokens</text>
  </g>
</svg>
